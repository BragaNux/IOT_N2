; Para compilar no VS Code com a extensão PlatformIO (o Wokwi for VS Code só simula, não compila).
[platformio]
src_dir = .

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
  beegee-tokyo/DHT sensor library for ESPx
  madhephaestus/ESP32Servo
  knolleary/PubSubClient
  bblanchon/ArduinoJson
